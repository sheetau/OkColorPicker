[package]
name = "zgui-platform-winit"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
description = "Pinned zgui winit backend with an opt-in DirectComposition window policy"
repository = "https://github.com/zortax/zgui"
publish = false

[features]
direct-composition = []

[dependencies]
accesskit = "=0.24.1"
accesskit_winit = "=0.33.2"
arboard = { version = "=3.7.0", default-features = false }
raw-window-handle = "=0.6.2"
tracing = "=0.1.44"
winit = "=0.30.13"
zgui-geom = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-platform = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-profile = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-vocab = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }

[target.'cfg(any(target_os = "linux", target_os = "dragonfly", target_os = "freebsd", target_os = "netbsd", target_os = "openbsd"))'.dependencies]
smithay-clipboard = "=0.7.3"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "=0.6.2"
muda = { version = "=0.21.2", default-features = false }
objc2 = "=0.6.5"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSWindow", "NSView", "NSResponder", "NSButton", "NSControl", "NSGraphics", "NSRunningApplication", "NSEvent", "block2"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSUserDefaults", "NSGeometry", "NSObject", "NSNotification", "NSOperation", "block2"] }
