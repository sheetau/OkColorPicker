[package]
name = "zgui-render-wgpu"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
publish = false
description = "Pinned zgui renderer with GPU output texture access"
repository = "https://github.com/zortax/zgui"

[dependencies]
bincode = { version = "=1.3.3" }
bytemuck = { version = "=1.25.2", features = ["derive"] }
futures = { version = "=0.3.34", features = ["thread-pool"] }
naga = { version = "=29.0.4", features = ["deserialize"] }
rustc-hash = { version = "=2.1.3" }
tracing = { version = "=0.1.44" }
wgpu = { version = "=29.0.4", features = ["naga-ir"] }
zgui-atlas = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-bits = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-color = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-geom = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-profile = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-render = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-scene = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-wgsl = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }

[build-dependencies]
bincode = { version = "=1.3.3" }
naga = { version = "=29.0.4", features = ["wgsl-in", "serialize"] }
zgui-wgsl = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
