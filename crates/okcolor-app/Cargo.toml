[package]
name = "okcolor-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
okcolor-core = { path = "../okcolor-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
tempfile = "=3.27.0"
zgui.workspace = true
zgui-render-wgpu.workspace = true
zgui-render-vector-vello.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
# Prevent unrelated applications' dxcompiler.dll files on PATH from being loaded.
wgpu = { version = "=29.0.4", features = ["static-dxc"] }

[dev-dependencies]
zgui-platform-headless.workspace = true
