[package]
name = "okcolor-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
okcolor-core = { path = "../okcolor-core" }
okcolor-csp = { path = "../okcolor-csp" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
tempfile = "=3.27.0"
zgui.workspace = true
zgui-render-wgpu.workspace = true
zgui-render-vector-vello.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
futures = "=0.3.34"
windows = { version = "=0.62.2", features = ["Foundation", "Graphics_Display", "System", "Win32_System_WinRT"] }
raw-window-handle = "=0.6.2"
windows-sys = { version = "=0.61.2", features = ["Win32_Devices_Display", "Win32_Graphics_Gdi", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
zgui-platform-winit = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a", features = ["direct-composition"] }
# Prevent unrelated applications' dxcompiler.dll files on PATH from being loaded.
wgpu = { version = "=29.0.4", features = ["static-dxc"] }

[dev-dependencies]
half = "=2.7.1"
zgui-platform-headless.workspace = true

[target.'cfg(target_os = "windows")'.dev-dependencies]
winit = "=0.30.13"
