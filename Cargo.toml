[workspace]
members = ["crates/okcolor-core", "crates/okcolor-app"]
exclude = ["vendor/zgui-platform-winit", "vendor/zgui-wgsl", "vendor/zgui-render-wgpu"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"

[workspace.dependencies]
zgui = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-render-wgpu = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-render-vector-vello = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }
zgui-platform-headless = { git = "https://github.com/zortax/zgui", rev = "80baa3c7cb0fbbe1c058f10059e076e41c0a1b9a" }

[patch."https://github.com/zortax/zgui"]
zgui-platform-winit = { path = "vendor/zgui-platform-winit" }
zgui-wgsl = { path = "vendor/zgui-wgsl" }
zgui-render-wgpu = { path = "vendor/zgui-render-wgpu" }
